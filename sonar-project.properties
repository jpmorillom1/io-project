# SonarQube — proyecto único: backend (io-api, Java 21) + frontend (io-ui, React/TS)
sonar.projectKey=g9-io-project
sonar.projectName=g9-io-project

sonar.sourceEncoding=UTF-8

# Fuentes de producción de ambos módulos
sonar.sources=io-api/src/main/java,io-ui/src
sonar.tests=io-api/src/test/java

# Java: bytecode compilado por Gradle (el CI compila antes de escanear)
sonar.java.source=21
sonar.java.binaries=io-api/build/classes/java/main
sonar.java.test.binaries=io-api/build/classes/java/test

# Cobertura JaCoCo del backend (io-ui aún no tiene tests)
sonar.coverage.jacoco.xmlReportPaths=io-api/build/reports/jacoco/test/jacocoTestReport.xml

sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/*.d.ts
