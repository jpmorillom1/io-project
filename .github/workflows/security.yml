name: Security (OWASP)

# Pruebas de vulnerabilidades del plan de pruebas:
#   - Dependency-Check (SCA)  → VUL-06 / RNF-SEC-06
#   - gitleaks (secretos)     → VUL-01 / RNF-SEC-01
#   - ZAP baseline (DAST)     → VUL-02/03/04/05 / RNF-SEC-02..05
#
# Variables/secretos del repo:
#   secrets.NVD_API_KEY        acelera la descarga de la base NVD (recomendado)
#   vars.SECURITY_TARGET_URL   URL del ambiente de pruebas para el escaneo ZAP

on:
  pull_request:
    branches: [master, main, develop]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'   # semanal: las CVE aparecen aunque el código no cambie

permissions:
  contents: read
  security-events: write   # subir SARIF a la pestaña Security

jobs:
  # ─────────────────────────── SCA: dependencias ───────────────────────────
  dependency-check:
    name: OWASP Dependency-Check (SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle (con cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Analizar dependencias (falla si CVSS >= 7)
        working-directory: io-api
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew dependencyCheckAnalyze --no-daemon

      - name: Subir SARIF a Security
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: io-api/build/reports/dependency-check-report.sarif
        continue-on-error: true

      - name: Subir reporte HTML/JSON
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: io-api/build/reports/dependency-check-report.*
          retention-days: 30

  # ──────────────────────────── Secretos ───────────────────────────────────
  gitleaks:
    name: gitleaks (secretos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # escanea también el historial

      - name: Ejecutar gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # ─────────────────────────── DAST: ZAP baseline ──────────────────────────
  zap-baseline:
    name: OWASP ZAP baseline (DAST)
    runs-on: ubuntu-latest
    if: ${{ vars.SECURITY_TARGET_URL != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ vars.SECURITY_TARGET_URL }}
          rules_file_name: '.zap/rules.tsv'
          # -I: no marcar el job como fallido por alertas de aviso (WARN); las High sí fallan.
          cmd_options: '-a'
          allow_issue_writing: false
