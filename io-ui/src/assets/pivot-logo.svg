<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Máscara para perforar los centros y mantener transparencia real en el fondo -->
    <mask id="inner-holes">
      <rect width="100%" height="100%" fill="white" />
      <circle cx="180" cy="340" r="52" fill="black" />
      <circle cx="180" cy="140" r="38" fill="black" />
      <circle cx="350" cy="240" r="38" fill="black" />
    </mask>
  </defs>

  <!-- Estructura del ícono -->
  <g mask="url(#inner-holes)">
    <!-- Líneas de conexión -->
    <line x1="180" y1="340" x2="180" y2="140" stroke="black" stroke-width="32" stroke-linecap="round" />
    <line x1="180" y1="340" x2="350" y2="240" stroke="black" stroke-width="32" stroke-linecap="round" />

    <!-- Nodos exteriores -->
    <circle cx="180" cy="340" r="95" fill="black" />
    <circle cx="180" cy="140" r="72" fill="black" />
    <circle cx="350" cy="240" r="72" fill="black" />
  </g>
</svg>
