server:
  port: 8080

spring:
  application:
    name: io-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/io_platform}
    username: ${DB_USER:io_user}
    password: ${DB_PASSWORD:io_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  web:
    resources:
      add-mappings: false
#  mvc:
#    throw-exception-if-no-handler-found: true

# ── LangChain4j ────────────────────────────────────────────────────────────────
# Chat model: OpenAI-compatible apuntado a Groq
# Embeddings: AllMiniLM local (no requiere API key)
langchain4j:
  open-ai:
    chat-model:
      api-key: ${GROQ_API_KEY:demo}
      base-url: https://api.groq.com/openai/v1
      model-name: ${GROQ_MODEL_NAME:llama-3.3-70b-versatile}
      temperature: 0.
      max-tokens: 2048
      log-requests: true
      log-responses: true

# ── Configuración propia de la app ─────────────────────────────────────────────
app:
  chroma-url: ${CHROMA_URL:http://localhost:8000}
  rag:
    reingestar: ${RAG_REINGESTAR:true}
    incluir-pdf: ${RAG_INCLUIR_PDF:true}
  sesion:
    # Días sin actividad tras los cuales se purga una sesión (memoria, historial y problemas).
    retencion-dias: ${SESION_RETENCION_DIAS:30}
  titulos:
    # Modelo que nombra cada conversación en la barra lateral. Es una tarea de una línea:
    # usa el modelo más pequeño de Groq, no el del tutor.
    model-name: ${GROQ_MODELO_TITULOS:llama-3.1-8b-instant}

# ── Logging ────────────────────────────────────────────────────────────────────
logging:
  level:
    jpap.dev: DEBUG
    dev.langchain4j: INFO
    org.hibernate.SQL: WARN
