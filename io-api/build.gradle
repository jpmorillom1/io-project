plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
	// OWASP Dependency-Check (SCA): analiza las dependencias contra la base de CVEs (NVD).
	// Si la versión no está disponible en tu red, ajústala a la última estable publicada.
	id 'org.owasp.dependencycheck' version '10.0.4'
}

group = 'jpap.dev'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'

	// LangChain4j — núcleo + AiServices
	implementation 'dev.langchain4j:langchain4j-spring-boot4-starter:1.13.0-beta23'
	// LangChain4j — chat model OpenAI-compatible (se apunta a Groq)
	implementation 'dev.langchain4j:langchain4j-open-ai-spring-boot4-starter:1.13.0-beta23'
	// LangChain4j — vector store ChromaDB
	// Excluye el cliente JDK para evitar conflicto con el Spring RestClient del starter
	implementation('dev.langchain4j:langchain4j-chroma:1.13.0-beta23') {
		exclude group: 'dev.langchain4j', module: 'langchain4j-http-client-jdk'
	}
	// LangChain4j — modelo de embeddings local (sin API key, para RAG en dev)
	implementation 'dev.langchain4j:langchain4j-embeddings-all-minilm-l6-v2-q:1.13.0-beta23'
	// LangChain4j — parser PDF via Apache PDFBox
	implementation 'dev.langchain4j:langchain4j-document-parser-apache-pdfbox:1.13.0-beta23'
	// LangChain4j — módulo agéntico: HumanInTheLoop + PendingResponse para aprobación humana
	implementation 'dev.langchain4j:langchain4j-agentic:1.13.0-beta23'
}

// Expone nombres de parámetros en bytecode → Jackson puede deserializar records sin @JsonProperty
tasks.withType(JavaCompile).configureEach {
	options.compilerArgs += ['-parameters']
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy tasks.jacocoTestReport
	// En CI no hay Postgres/Chroma/Groq: -PciSkipContextTests omite los tests
	// que cargan el contexto Spring completo (IoApiApplicationTests y los *IT)
	if (project.hasProperty('ciSkipContextTests')) {
		exclude '**/IoApiApplicationTests*'
		exclude '**/*IT.class'
	}
}

jacoco {
	toolVersion = '0.8.13'
}

jacocoTestReport {
	dependsOn tasks.test
	reports {
		xml.required = true   // SonarQube lee el XML
		html.required = true
	}
}

// ─────────────────────────── OWASP Dependency-Check ───────────────────────────
// Análisis de composición de software (SCA): cruza las dependencias con la NVD.
//   gradle dependencyCheckAnalyze     → genera build/reports/dependency-check-report.*
// Cubre VUL-06 / RNF-SEC-06 del plan de pruebas.
dependencyCheck {
	// Falla el build ante cualquier CVE de severidad Alta/Crítica (CVSS >= 7.0).
	failBuildOnCVSS = 7.0f
	formats = ['HTML', 'JSON', 'SARIF']
	// Falsos positivos justificados (con comentario y fecha) van aquí.
	suppressionFile = 'dependency-check-suppression.xml'
	// La NVD exige API key para descargas sin rate-limit severo. Se toma del entorno.
	nvd {
		apiKey = System.getenv('NVD_API_KEY')
	}
	// Analizadores irrelevantes para un proyecto Java puro: acelera el escaneo.
	analyzers {
		assemblyEnabled = false
		nodeAuditEnabled = false
		nodeEnabled = false
	}
	// No rompas el análisis por un módulo de test con un CVE informativo.
	skipConfigurations = ['testAnnotationProcessor', 'testCompileOnly']
}
